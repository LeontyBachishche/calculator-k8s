apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: web-app
        image: calc-web-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: web-app
spec:
  ports:
  - port: 5000
  selector:
    app: web-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calc-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calc-worker
  template:
    metadata:
      labels:
        app: calc-worker
    spec:
      containers:
      - name: calc-worker
        image: calc-worker:latest
        imagePullPolicy: Never
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
